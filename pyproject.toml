[project]
name = "anjaney"
version = "0.1.0"
description = "Personal-baseline, abstention-aware text-first mental-health screening aid"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ANJANEY Research Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "sentence-transformers>=2.7.0",
    "vaderSentiment>=3.3.2",
    "mapie>=0.8.0",
    "matplotlib>=3.8.0",
    "optimum[onnxruntime]>=1.19.0",
    "onnxruntime>=1.17.0",
    "psutil>=5.9.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
anjaney = "anjaney.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"