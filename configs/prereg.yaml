study_title: "ANJANEY: Campus Mental-Health Screening Aid Gating Test"
hypotheses:
  rq1: "Within-session check-in drift differs significantly between high-risk (PHQ-8 >= 10) and low-risk participants after position conditioning."
  rq3: "Adding personal-baseline deviation signals improves selective risk and conformal interval efficiency over population-only fusion."

analysis_parameters:
  primary_metric_rq1: "participant_level_late_session_conditioned_drift"
  risk_split_threshold: 10.0
  warmup_windows_k: 3
  empirical_bayes_k: 2.0
  pca_components_maha: 16
  position_bins: 5
  late_session_cutoff: 0.5
  ewma_alpha: 0.3
  cusum_slack_k: 0.5
  z_score_winsorize_cap: 5.0
  alpha: 0.10
  conformal_max_width: 8.0
  conformal_margin: 0.5
  n_permutations: 10000
  n_bootstrap: 2000
  minimum_effect_size_d: 0.30
  equivalence_bound_delta: 0.15

decision_rules:
  supported: "One-sided permutation p < 0.05 (with (count+1)/(M+1) correction) AND bootstrap 95% CI > 0 AND Cohen's d >= 0.30"
  falsified: "Equivalence test: Entire bootstrap 95% CI of group difference lies strictly within [-equivalence_bound_delta, +equivalence_bound_delta]"
  inconclusive: "Neither SUPPORTED nor FALSIFIED (insufficient statistical power to rule out effect or equivalence)"